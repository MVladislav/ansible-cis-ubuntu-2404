---
name: Report an issue
description: Report an issue.
body:
  - type: markdown
    attributes:
      value: |
        This issue form is for reporting bugs only!

        If you have a feature or enhancement request, please use the feature request issue template
  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the problem
      description: >-
        Describe the issue you are experiencing here to communicate to the
        maintainers. Tell us what you were trying to do and what happened.

        Provide a clear and concise description of what the problem is.
  - type: textarea
    validations:
      required: true
    attributes:
      label: Expected behavior
      description: >-
        A clear and concise description of what you expected to happen.
  - type: input
    attributes:
      label: Affected CIS recommendation
      description: >-
        If the issue is related to a specific rule, provide the recommendation
        ID and title (e.g. "1.1.1.1 Ensure cramfs kernel module is not available").
        If it is an EXTENDED rule, mark it as such.
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    validations:
      required: true
    attributes:
      label: Role version
      description: >
        Git tag, commit SHA, or "latest main". If installed via Ansible Galaxy,
        the version from requirements.
      placeholder: v1.0.0
  - type: input
    attributes:
      label: Ansible core version
      placeholder: e.g. 2.21.3
      description: >
        Output of `ansible --version` on the control node.
  - type: dropdown
    validations:
      required: true
    attributes:
      label: How did you install the role?
      options:
        - Ansible Galaxy
        - Git clone
        - Other (specify in the description)
  - type: textarea
    attributes:
      label: Reproduction steps
      description: >
        Playbook snippet and the variables you set (rule switches, section
        variables) that trigger the problem.
      render: yaml
  - type: textarea
    attributes:
      label: Anything in the logs that might be useful for us?
      description: For example, ansible or molecule output, error messages.
      render: txt
  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information for us, use the field below.
        Please note, you can attach screenshots or screen recordings here, by
        dragging and dropping files in the field below.
